name: Story 1.1 Windows inventory verification

on:
  push:
    branches: [test/b-route-story-1-1-windows-ci-2026-11-03]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aa86ba42eb2e06da84b2e40a87b099faca23be5
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed source, CLI and actual NTFS junction guards
        working-directory: source
        shell: python
        run: |
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import stat
          import subprocess
          import sys
          import traceback
          import time
          import uuid

          root = pathlib.Path.cwd()
          run_id = 'win-' + uuid.uuid4().hex
          utc_date = dt.datetime.now(dt.timezone.utc).date().isoformat()
          evidence = root / 'logs/ci' / utc_date / 'story-1-1-windows-validation' / run_id
          evidence.mkdir(parents=True, exist_ok=False)
          state = {'status': 'running', 'source_commit': '4aa86ba42eb2e06da84b2e40a87b099faca23be5',
                   'workflow_commit': os.getenv('GITHUB_SHA'), 'run_id': os.getenv('GITHUB_RUN_ID'),
                   'platform': platform.platform(), 'python': sys.version, 'checks': {}}

          def save(name, data):
              (evidence / name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def command(label, args, cwd=root, *, timeout_seconds=240, tolerate_timeout=False):
              started = time.perf_counter()
              metadata = {'argv': [str(x) for x in args], 'cwd': str(cwd), 'status': 'started',
                          'timeout_seconds': timeout_seconds}
              save(label + '.command.json', metadata)
              print('COMMAND START ' + json.dumps(metadata), flush=True)
              try:
                  result = subprocess.run(metadata['argv'], cwd=cwd, capture_output=True, timeout=timeout_seconds)
              except subprocess.TimeoutExpired as exc:
                  result = subprocess.CompletedProcess(metadata['argv'], 124, exc.stdout or b'', exc.stderr or b'')
                  metadata['status'] = 'timeout'
              else:
                  metadata['status'] = 'completed'
              metadata.update(exit=result.returncode, elapsed_seconds=round(time.perf_counter() - started, 3))
              (evidence / (label + '.stdout')).write_bytes(result.stdout)
              (evidence / (label + '.stderr')).write_bytes(result.stderr)
              save(label + '.command.json', metadata)
              print('COMMAND RESULT ' + label + ' ' + json.dumps(metadata), flush=True)
              print('STDOUT ' + label + '\n' + result.stdout.decode('utf-8', errors='replace'), flush=True)
              print('STDERR ' + label + '\n' + result.stderr.decode('utf-8', errors='replace'), flush=True)
              if metadata['status'] == 'timeout' and not tolerate_timeout:
                  raise TimeoutError(label + ' timed out after ' + str(timeout_seconds) + ' seconds')
              return result

          def git(*args):
              result = subprocess.run(['git', *args], cwd=root, capture_output=True, check=True)
              return result.stdout

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def protected():
              paths = git('ls-files', '-z').decode('utf-8').split('\0')
              return {p: digest(root / p) if (root / p).is_file() else None for p in paths if p}

          def inventory_output(repo, identity):
              matches = list((repo / 'logs/ci').glob('*/b-route-baseline-inventory/' + identity))
              assert len(matches) == 1, matches
              return matches[0]

          def cli(label, repo=root, epics='_bmad-output/planning-artifacts/b-route/epics.md', identity=None):
              identity = identity or (run_id + '-' + label)
              result = command(label, [sys.executable, root / 'scripts/python/inventory_b_route_baseline.py',
                                      '--root', repo, '--epics', epics, '--run-id', identity])
              return result, identity

          def junction(label, link, target):
              result = command(label, ['cmd.exe', '/d', '/c', 'mklink', '/J', link, target])
              assert result.returncode == 0, 'Real junction creation blocked; do not elevate or change ACL'
              attributes = link.lstat().st_file_attributes
              save(label + '.attributes.json', {'link': str(link), 'target': str(target), 'attributes': attributes})
              assert attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT

          before = None
          original_status = None
          cases = []
          try:
              assert os.name == 'nt', 'Native Windows is required'
              volume = command('filesystem', ['powershell.exe', '-NoProfile', '-Command',
                               '(Get-Volume -DriveLetter (Get-Item .).PSDrive.Name).FileSystemType'])
              assert volume.returncode == 0 and volume.stdout.decode('utf-8').strip() == 'NTFS'
              state['git_version'] = git('--version').decode('utf-8').strip()
              assert git('rev-parse', 'HEAD').decode().strip() == state['source_commit']
              assert git('rev-parse', 'HEAD^').decode().strip() == '241543d9c6e56859314e0d52a0459958501b4105'
              assert git('merge-base', 'bad70a5e446b2c4f3263d3e8c1fd2d1c6781b65f', 'HEAD').decode().strip() == 'bad70a5e446b2c4f3263d3e8c1fd2d1c6781b65f'
              expected = {
                  'scripts/python/_b_route_inventory.py': 'bb976d4a5247792faff23a7046ff754ac0049939',
                  'scripts/python/inventory_b_route_baseline.py': '042fadf591a626429c3c4beddc9502d8307d3e05',
                  'scripts/python/tests/test_b_route_inventory.py': '02bd87c87babdd109cfc75fe95202e20d70e45e5',
                  'docs/workflows/b-route-baseline-inventory.md': 'ca5ef5d94166a871c182326f3e32ed9b5b4f9d4b',
              }
              assert set(git('diff', '--name-only', 'HEAD^', 'HEAD').decode().splitlines()) == {'scripts/python/tests/test_b_route_inventory.py'}
              save('source-file-identity.json', {p: {'git_blob': git('rev-parse', 'HEAD:' + p).decode().strip(),
                                                   'checkout_raw_sha256': digest(root / p)} for p in expected})
              for p, blob in expected.items():
                  assert git('rev-parse', 'HEAD:' + p).decode().strip() == blob, p
              original_status = git('status', '--porcelain=v1', '-uall')
              before = protected()
              save('protected-before.json', before)
              targets = [
                  'test_optional_planned_reference_reparse_and_permission_failures_block',
                  'test_source_pattern_permission_error_is_visible_before_resolver',
                  'test_untracked_manifest_only_source_bytes_trigger_drift_without_git_change',
              ]
              diagnostic_program = 'import json\nimport sys\nimport unittest\nfrom pathlib import Path\n\nroot = Path(sys.argv[2])\nsys.path.insert(0, str(root / "scripts/python/tests"))\nimport test_b_route_inventory\n\nstats = {}\nphases = []\ndef trace(frame, event, arg):\n    code = frame.f_code\n    if not code.co_filename.endswith("test_b_route_inventory.py"):\n        return None\n    if event == "line" and code.co_name in {"reparse", "denied", "denied_walk"} and frame.f_lineno == code.co_firstlineno + 1:\n        values = frame.f_locals\n        candidate = values.get("candidate", values.get("path"))\n        target = values.get("target")\n        if target is None and "self" in values:\n            target = values["self"].root / "sources"\n        if candidate is not None and target is not None:\n            candidate, target = Path(candidate), Path(target)\n            item = stats.setdefault(code.co_name, {"calls": 0, "lexical_hits": 0, "resolved_hits": 0, "examples": []})\n            item["calls"] += 1\n            lexical = candidate == target\n            resolved = candidate.resolve() == target.resolve()\n            item["lexical_hits"] += int(lexical)\n            item["resolved_hits"] += int(resolved)\n            if len(item["examples"]) < 5 or (resolved and not lexical and len(item["examples"]) < 10):\n                item["examples"].append({"candidate": str(candidate), "target": str(target),\n                    "candidate_resolved": str(candidate.resolve()), "target_resolved": str(target.resolve()),\n                    "lexical_equal": lexical, "resolved_equal": resolved})\n    if event == "line" and code.co_name == "test_optional_planned_reference_reparse_and_permission_failures_block":\n        values = frame.f_locals\n        if "report" in values and "guard" in values and "self.assert_invalid" in __import__("linecache").getline(code.co_filename, frame.f_lineno):\n            phases.append({"guard": getattr(values["guard"], "attribute", None), "adoptable": values["report"]["adoptable"],\n                           "diagnostic_codes": sorted({d["code"] for d in values["report"]["diagnostics"]})})\n    return trace\n\nsys.settrace(trace)\ntry:\n    result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName(sys.argv[1]))\nfinally:\n    sys.settrace(None)\n    print("FAULT INJECTION PATH DIAGNOSTICS " + json.dumps({"guards": stats, "phases": phases}), flush=True)\nsys.exit(0 if result.wasSuccessful() else 1)\n'
              diagnostic_runner = evidence / 'diagnostic-runner.py'
              diagnostic_runner.write_text(diagnostic_program, encoding='utf-8', newline='\n')
              isolated = []
              for index, name in enumerate(targets, 1):
                  label = 'isolated-' + str(index)
                  result = command(label, [sys.executable, diagnostic_runner,
                                   'test_b_route_inventory.InventoryTests.' + name, root],
                                   cwd=root / 'scripts/python/tests', timeout_seconds=120, tolerate_timeout=True)
                  text = result.stderr.decode('utf-8', errors='replace')
                  count = re.search(r'Ran (\d+) tests?', text)
                  metadata = json.loads((evidence / (label + '.command.json')).read_text(encoding='utf-8'))
                  item = {'test': name, 'exit': result.returncode, 'count': int(count[1]) if count else None,
                          'elapsed_seconds': metadata['elapsed_seconds'], 'command_status': metadata['status'],
                          'passed': result.returncode == 0 and bool(count) and int(count[1]) == 1,
                          'skipped_lines': [line for line in text.splitlines() if 'skipped ' in line]}
                  isolated.append(item)
                  save('isolated-tests.json', isolated)
                  print('ISOLATED TEST RESULT ' + json.dumps(item), flush=True)
              state['checks']['isolated_tests'] = isolated
              if all(item['passed'] and not item['skipped_lines'] for item in isolated):
                  result = command('unit', [sys.executable, '-m', 'unittest', 'discover', '-s',
                                           'scripts/python/tests', '-p', 'test_b_route_inventory.py', '-v'],
                                           timeout_seconds=600, tolerate_timeout=True)
                  unit_text = result.stderr.decode('utf-8', errors='replace')
                  count = re.search(r'Ran (\d+) tests?', unit_text)
                  state['checks']['unit'] = {'exit': result.returncode, 'count': int(count[1]) if count else None,
                                            'passed': result.returncode == 0 and bool(count) and int(count[1]) == 59,
                                            'skipped_lines': [line for line in unit_text.splitlines() if 'skipped ' in line]}
              else:
                  state['checks']['unit'] = {'passed': False, 'status': 'not-run',
                                            'reason': 'An isolated target failed or skipped; do not repeat the unchanged full suite.'}
              print('UNIT SUITE RESULT ' + json.dumps(state['checks']['unit']), flush=True)
              reports = []
              for label in ('capture-a', 'capture-b'):
                  result, identity = cli(label)
                  folder = inventory_output(root, identity)
                  report = json.loads((folder / 'inventory.json').read_text(encoding='utf-8'))
                  assert result.returncode == 1 and report['stable'] and not report['adoptable']
                  errors = [x for x in report['diagnostics'] if x['severity'] == 'error']
                  assert len(errors) == 1 and errors[0]['code'] == 'missing-input'
                  assert errors[0]['location'] == 'logs/ci/2026-05-06/sc-build-tdd/summary.json'
                  assert (folder / 'inventory.md').stat().st_size > 0
                  reports.append((identity, folder, report))
              assert reports[0][2]['content_identity'] == reports[1][2]['content_identity']
              assert reports[0][2]['collection']['event_id'] != reports[1][2]['collection']['event_id']
              state['checks']['two_captures'] = 'stable identities; expected historical missing-input; not adoptable'
              first_identity, first_folder, _ = reports[0]
              first_bytes = {p.name: digest(p) for p in first_folder.iterdir()}
              result, _ = cli('repeat', identity=first_identity)
              assert result.returncode == 2
              assert first_bytes == {p.name: digest(p) for p in first_folder.iterdir()}
              state['checks']['repeat_no_overwrite'] = True
              result, identity = cli('missing-epics', epics='planning/missing.md')
              assert result.returncode == 1
              missing_output = inventory_output(root, identity)
              report_files = [path for path in (missing_output / 'inventory.json', missing_output / 'failure.json') if path.is_file()]
              assert len(report_files) == 1
              missing_report = json.loads(report_files[0].read_text(encoding='utf-8'))
              assert missing_report['adoptable'] is False
              missing_diagnostics = missing_report.get('diagnostics', [])
              assert any(d.get('severity') == 'error' and
                         ((d.get('location') == 'planning/missing.md' and d.get('code') in ('missing-input', 'invalid-epics')) or
                          (d.get('code') == 'inventory-failed' and 'planning/missing.md' in d.get('message', '')))
                         for d in missing_diagnostics)
              if report_files[0].name == 'inventory.json':
                  assert (missing_output / 'inventory.md').stat().st_size > 0
              state['checks']['missing_epics_no_fallback'] = {'exit': result.returncode, 'report': report_files[0].name,
                  'diagnostics': [{'code': d.get('code'), 'location': d.get('location')} for d in missing_diagnostics if d.get('severity') == 'error']}
              print('MISSING EPICS DIAGNOSTIC CHECK ' + json.dumps(state['checks']['missing_epics_no_fallback']), flush=True)

              sys.path.insert(0, str(root / 'scripts/python/tests'))
              from test_b_route_inventory import InventoryTests
              for kind in ('input', 'output'):
                  case = InventoryTests(methodName='runTest')
                  cases.append(case)
                  case.setUp()
                  save(kind + '-fixture.json', {'root': str(case.root)})
                  fixture_volume = command(kind + '-filesystem', ['powershell.exe', '-NoProfile', '-Command',
                                           '(Get-Volume -DriveLetter (Get-Item .).PSDrive.Name).FileSystemType'], cwd=case.root)
                  assert fixture_volume.returncode == 0 and fixture_volume.stdout.decode('utf-8').strip() == 'NTFS'
                  fixture_before = case.bytes_before()
                  if kind == 'input':
                      junction('input-junction-create', case.root / 'planning-junction', case.root / 'planning')
                      result, identity = cli('input-junction', repo=case.root, epics='planning-junction/epics.md')
                      folder = inventory_output(case.root, identity)
                      failure = json.loads((folder / 'failure.json').read_text(encoding='utf-8'))
                      save('input-junction-failure.json', failure)
                      assert result.returncode == 1 and 'reparse' in failure['error'].lower()
                      assert not (folder / 'inventory.json').exists()
                  else:
                      target = case.root / 'junction-empty-target'
                      target.mkdir(exist_ok=False)
                      parent = case.root / 'logs/ci' / dt.datetime.now(dt.timezone.utc).date().isoformat()
                      parent.mkdir(parents=True, exist_ok=False)
                      junction('output-junction-create', parent / 'b-route-baseline-inventory', target)
                      result, identity = cli('output-junction', repo=case.root, epics=case.epics)
                      assert result.returncode == 2 and b'reparse' in result.stdout.lower()
                      target_entries = [entry.name for entry in target.iterdir()]
                      save('output-junction-target-after.json', {'entries': target_entries})
                      assert not target_entries
                  for path, value in fixture_before.items():
                      assert digest(case.root / path) == value, path
                  state['checks'][kind + '_real_junction'] = True
              state['status'] = 'passed' if state['checks']['unit']['passed'] else 'failed-or-blocked'
          except Exception:
              state['status'] = 'failed-or-blocked'
              state['error'] = traceback.format_exc()
              raise
          finally:
              try:
                  if before is not None:
                      after = protected()
                      save('protected-after.json', after)
                      unchanged = before == after and original_status == git('status', '--porcelain=v1', '-uall')
                      state['checks']['protected_source_and_git_status_unchanged'] = unchanged
                      if not unchanged:
                          state['status'] = 'failed-or-blocked'
                  save('summary.json', state)
                  print('FINAL SAFE SUMMARY ' + json.dumps(state), flush=True)
              finally:
                  for case in cases:
                      if hasattr(case, 'temporary'):
                          case.tearDown()
              assert state['status'] == 'passed', state
      - name: Upload original evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-1-1-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/logs/ci/*/story-1-1-windows-validation/**
            source/logs/ci/*/b-route-baseline-inventory/win-*/**
          if-no-files-found: error
          retention-days: 14
