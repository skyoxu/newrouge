name: MVG Integration Pilot

on:
  workflow_dispatch:
    inputs:
      mutation_probe:
        description: Run the optional seeded mutation experiment
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/mvg-integration.yml'
      - 'scripts/python/*mvg*'
      - 'scripts/python/tests/test_mvg*'
      - 'scripts/python/_project_health_runtime_snapshot.py'
      - 'scripts/python/run_gdunit.py'
      - 'scripts/python/check_workflow_gate_enforcement.py'
      - 'scripts/python/config/workflow-gate-allowlist.json'
      - 'docs/testing/mvg/**'
      - 'Game.Core.Tests/Integration/Mvg*'
      - 'Game.Core.Tests/Services/Mvg*'
      - 'Game.Core.Tests/Tasks/Task0061AcceptanceTests.cs'
      - 'Tests.Godot/tests/Integration/Mvg/**'
      - 'Tests.Godot/tests/Integration/test_reward_shop_event_resume_determinism.gd'
      - 'Tests.Godot/tests/Scenes/Combat/test_combat_scene_feedback_log.gd'
      - 'Game.Core/Services/RewardRouteOwnershipService.cs'
      - 'Game.Core/Services/CardPoolCatalog.cs'
      - 'Game.Core/Services/DeterministicOfferService.cs'
      - 'Game.Core/Contracts/Offers/**'
      - 'Game.Core/Contracts/Events/RewardOffer*'
      - 'Game.Core/Contracts/Combat/**'
      - 'Game.Core/Repositories/ISaveGameRepository.cs'
      - 'Game.Godot/Scripts/RewardScene.gd'
      - 'Game.Godot/Scripts/Main.gd'
      - 'Game.Godot/Scripts/Reward/**'
      - 'Game.Godot/Scripts/UI/CombatScene.cs'
      - 'Game.Godot/Scenes/Reward.tscn'
      - 'Game.Godot/Scenes/Main.tscn'
      - 'Game.Godot/Scenes/Event.tscn'
      - 'Game.Godot/Scenes/Shop.tscn'
      - 'Game.Godot/Scenes/Combat.tscn'
      - 'Game.Godot/Adapters/SqliteDataStore.cs'
      - 'Game.Godot/Adapters/Db/SaveGameRepository.cs'

permissions:
  contents: read

jobs:
  m1-production:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot .NET
        shell: pwsh
        run: ./scripts/ci/download_godot_release.ps1 -Version '4.5.1' -PreferConsole
      - name: Verify runner failure handling
        run: python -m unittest discover -s scripts/python/tests -p test_mvg_acceptance.py -v
      - name: Run committed M1 production scope and disconnected-input challenge
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot commit --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1200 --challenge-input
      - name: Run workspace M1 production scope
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot workspace --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1200
      - name: Optional seeded mutation experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_probe }}
        run: python scripts/python/run_mvg_mutation_probe.py --snapshot commit --revision HEAD
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvg-integration-evidence
          path: |
            logs/ci/mvg-acceptance/**
            logs/ci/mvg-mutation/**
            !logs/**/snapshot/**
          retention-days: 14
