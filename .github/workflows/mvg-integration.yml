name: MVG Integration Pilot

on:
  workflow_dispatch:
    inputs:
      mutation_probe:
        description: Run the optional seeded mutation experiment
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/mvg-integration.yml'
      - 'scripts/python/*mvg*'
      - 'scripts/python/tests/test_mvg*'
      - 'scripts/python/_project_health_runtime_snapshot.py'
      - 'scripts/python/run_gdunit.py'
      - 'scripts/python/check_workflow_gate_enforcement.py'
      - 'scripts/python/config/workflow-gate-allowlist.json'
      - 'docs/testing/mvg/**'
      - 'Game.Core.Tests/Integration/Mvg*'
      - 'Game.Core.Tests/Services/Mvg*'
      - 'Tests.Godot/tests/Integration/Mvg/**'
      - 'Game.Core/State/RunStateMachine.cs'
      - 'Game.Core/Services/CombatService.cs'
      - 'Game.Core/Contracts/Run/**'
      - 'Game.Core/Contracts/Combat/**'
      - 'Game.Core/Contracts/Events/RunStartedEvent.cs'
      - 'Game.Core/Contracts/Events/MapNode*Event.cs'
      - 'Game.Godot/Scripts/Main.gd'
      - 'Game.Godot/Scripts/UI/MainMenu.cs'
      - 'Game.Godot/Scripts/UI/DifficultySelect.cs'
      - 'Game.Godot/Scripts/UI/CharacterSelect.cs'
      - 'Game.Godot/Scripts/UI/MapScene.cs'
      - 'Game.Godot/Scripts/UI/CombatScene.cs'
      - 'Game.Godot/Scripts/RewardScene.gd'
      - 'Game.Godot/Scripts/Reward/**'
      - 'Game.Godot/Scenes/Main.tscn'
      - 'Game.Godot/Scenes/Map/**'
      - 'Game.Godot/Scenes/Combat.tscn'
      - 'Game.Godot/Scenes/Reward.tscn'
      - 'Game.Core.Tests/State/GameStateMachineTests.cs'
      - 'Game.Core.Tests/Services/CombatServiceTests.cs'
      - 'Tests.Godot/tests/Integration/test_m1_run_entry_vertical_slice.gd'
      - 'Tests.Godot/tests/Integration/test_map_navigation_state_transitions.gd'
      - 'Tests.Godot/tests/Scenes/Battle/test_battle_card_targeting_drag_play_flow.gd'

permissions:
  contents: read

jobs:
  critical-journeys:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Godot .NET
        shell: pwsh
        run: ./scripts/ci/download_godot_release.ps1 -Version '4.5.1' -PreferConsole
      - name: Verify runner failure handling
        run: python -m unittest discover -s scripts/python/tests -p test_mvg_acceptance.py -v
      - name: Run committed critical journeys and disconnected-input challenge
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot commit --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1800 --challenge-input
      - name: Run workspace critical journeys
        shell: pwsh
        run: python scripts/python/run_mvg_acceptance.py --mode run --snapshot workspace --revision HEAD --godot-bin $env:GODOT_BIN --timeout-sec 1800
      - name: Optional seeded mutation experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_probe }}
        run: python scripts/python/run_mvg_mutation_probe.py --snapshot commit --revision HEAD
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvg-integration-evidence
          path: |
            logs/ci/mvg-acceptance/**
            logs/ci/mvg-mutation/**
            !logs/**/snapshot/**
          retention-days: 14
