name: Story 1.4 Windows Record Validation

on:
  push:
    branches: [test/b-route-story-1-4-windows-2026-11-03]

permissions:
  contents: read

jobs:
  records:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run native Windows record and codec matrix
        shell: python
        run: |
          import sys
          sys.dont_write_bytecode = True

          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import re
          import subprocess
          import time
          from pathlib import Path

          root = Path.cwd()
          output = root / 'logs' / 'ci' / 'story-1-4-windows' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          output.mkdir(parents=True, exist_ok=False)
          assert os.name == 'nt', 'Native Windows is required'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'Unexpected checkout SHA'
          source_paths = [
              'scripts/python/_b_route_codec.py',
              'scripts/python/_b_route_records.py',
              'scripts/python/_b_route_record_owners.py',
              'scripts/python/_chapter5_contract_bindings.py',
              'scripts/python/validate_b_route_records.py',
              'scripts/python/verify_b_route_reference.py',
              'scripts/python/requirements-b-route.txt',
              'scripts/python/tests/test_b_route_records.py',
              'scripts/python/tests/test_b_route_codec.py',
              'docs/workflows/b-route-record-contract.md',
              'docs/workflows/b-route-record-validation.md',
              '.github/workflows/story-1-4-windows.yml',
          ] + [p.relative_to(root).as_posix() for p in sorted((root / 'docs/planning/b-route/schemas').glob('*.schema.json'))]
          environment = {
              'head': head, 'event_sha': os.environ['GITHUB_SHA'],
              'python': sys.version, 'platform': platform.platform(),
              'files': {p: {
                  'raw_sha256': hashlib.sha256((root / p).read_bytes()).hexdigest(),
                  'git_blob': subprocess.check_output(['git', 'rev-parse', 'HEAD:' + p], text=True).strip(),
              } for p in source_paths},
          }
          (output / 'environment.json').write_text(json.dumps(environment, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(environment, indent=2), flush=True)
          summary = {'head': head, 'native_windows': True, 'steps': [], 'exit_code': 0}

          def write_summary():
              (output / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')

          def run_logged(name, command, timeout):
              started = time.monotonic()
              try:
                  completed = subprocess.run(command, cwd=root, capture_output=True, text=True, encoding='utf-8', errors='replace', timeout=timeout)
                  stdout, stderr, code = completed.stdout, completed.stderr, completed.returncode
              except subprocess.TimeoutExpired as exc:
                  stdout = exc.stdout.decode('utf-8', errors='replace') if isinstance(exc.stdout, bytes) else (exc.stdout or '')
                  stderr = exc.stderr.decode('utf-8', errors='replace') if isinstance(exc.stderr, bytes) else (exc.stderr or '')
                  code = 124
              (output / (name + '.stdout')).write_text(stdout, encoding='utf-8')
              (output / (name + '.stderr')).write_text(stderr, encoding='utf-8')
              row = {'name': name, 'command': command, 'exit_code': code, 'elapsed_seconds': time.monotonic() - started, 'timeout_seconds': timeout}
              summary['steps'].append(row)
              if code:
                  summary['exit_code'] = 1
              write_summary()
              print(stdout, flush=True)
              print(stderr, flush=True)
              print(json.dumps(row), flush=True)
              return row, stdout, stderr

          install, _, _ = run_logged('dependencies', [sys.executable, '-B', '-m', 'pip', 'install', '--disable-pip-version-check', '-r', 'scripts/python/requirements-b-route.txt'], 120)
          versions = {}
          for name in ['jsonschema', 'referencing']:
              try:
                  versions[name] = importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  versions[name] = None
          summary['dependency_versions'] = versions
          if versions != {'jsonschema': '4.26.0', 'referencing': '0.37.0'}:
              summary['exit_code'] = 1
          write_summary()

          for pattern in ['test_b_route_records.py', 'test_b_route_codec.py']:
              name = pattern.removesuffix('.py')
              row, _, stderr = run_logged(name, [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'scripts/python/tests', '-p', pattern, '-v'], 180)
              if not re.search(r'^Ran [1-9][0-9]* tests? in ', stderr, re.MULTILINE):
                  summary['exit_code'] = 1
                  row['test_execution_confirmed'] = False
              else:
                  row['test_execution_confirmed'] = True
              if pattern == 'test_b_route_codec.py':
                  required_windows = [
                      'test_windows_actual_unicode_file_io_and_case_lookup',
                      'test_windows_actual_internal_junction_is_allowed_and_external_junction_rejected',
                      'test_windows_actual_exclusive_file_occupation_cannot_be_reported_as_success',
                  ]
                  required = {name: re.search(r'^' + re.escape(name) + r' \(test_b_route_codec\.WindowsIoTests\.' + re.escape(name) + r'\) \.\.\. ok$', stderr, re.MULTILINE) is not None for name in required_windows}
                  summary['required_windows_tests_passed'] = required
                  if not all(required.values()):
                      summary['exit_code'] = 1
              if pattern == 'test_b_route_records.py':
                  required_records = {
                      'test_bundle_reader_accepts_internal_directory_link': 'CandidateBundleTests',
                      'test_bundle_reader_rejects_external_directory_link_even_with_matching_bytes': 'CandidateBundleTests',
                      'test_candidate_bytes_override_disk_when_reference_uses_directory_alias': 'CandidateBundleTests',
                      'test_contract_directory_alias_keeps_candidate_only_dto_in_the_closure': 'OwnedReferenceTests',
                      'test_contract_closure_rejects_root_external_directory_link': 'OwnedReferenceTests',
                      'test_owned_locator_alias_binds_canonical_candidate_bytes_without_disk_shadow': 'OwnedReferenceTests',
                  }
                  required = {name: re.search(r'^' + re.escape(name) + r' \(test_b_route_records\.' + re.escape(owner) + r'\.' + re.escape(name) + r'\) \.\.\. ok$', stderr, re.MULTILINE) is not None for name, owner in required_records.items()}
                  summary['required_records_windows_tests_passed'] = required
                  if not all(required.values()):
                      summary['exit_code'] = 1
              write_summary()

          # Preserve the original suite outcome before any instrumented trials.
          summary['full_suite_exit_code'] = summary['exit_code']
          write_summary()
          diagnostic_source = r'''
          import sys
          sys.dont_write_bytecode = True
          import hashlib
          import json
          import os
          import time
          import unittest
          from pathlib import Path
          from types import CodeType

          assert os.name == 'nt', 'Timestamp diagnostics require real Windows'
          root = Path.cwd()
          output = Path(__file__).resolve().parent
          sys.path.insert(0, str(root / 'scripts/python'))
          sys.path.insert(0, str(root / 'scripts/python/tests'))
          import _b_route_codec as codec
          import test_b_route_codec as original_tests

          method_name = 'test_same_size_overwrite_during_final_path_resolution_is_rejected'
          original_class = original_tests.ReadIdentityRegressionTests
          original_method = getattr(original_class, method_name)
          watched = {
              codec.read_reference_bytes.__code__: ('reader', ('before', 'opened', 'after', 'current_info', 'final', 'data', 'resolved', 'current')),
              codec._stat_identity.__code__: ('stat_identity', ('info',)),
              codec._cross_stat_identity.__code__: ('cross_stat_identity', ('info',)),
              original_class.change_bytes_preserving_size_and_mtime.__code__: ('mutation', ('before', 'original', 'changed')),
              original_method.__code__: ('original_test', ('calls', 'result')),
          }
          for code in original_method.__code__.co_consts:
              if isinstance(code, CodeType) and code.co_name == 'resolve':
                  watched[code] = ('resolve', ('calls',))

          class ObservedCase(original_class):
              def _callTestMethod(self, method):
                  # Original setUp has already completed. No reader/helper body
                  # is replaced, and no extra file reads occur while tracing.
                  target = self.root / self.path
                  self.before_bytes = target.read_bytes()
                  self.events = []
                  self.mutation_calls = []

                  def observe(frame, event, value):
                      description = watched.get(frame.f_code)
                      if event == 'call':
                          if description is None:
                              return None
                          frame.f_trace_lines = False
                          if description[0] == 'mutation':
                              self.mutation_calls.append(True)
                          return observe
                      if event == 'return' and description is not None:
                          name, fields = description
                          existing = frame.f_locals
                          self.events.append({'function': name,
                                              'locals': {key: existing[key] for key in fields if key in existing},
                                              'return_value': value})
                      return observe

                  previous = sys.gettrace()
                  try:
                      sys.settrace(observe)
                      return super()._callTestMethod(method)
                  finally:
                      sys.settrace(previous)
                      self.after_bytes = target.read_bytes()

          def file_hash(data):
              return 'sha256:' + hashlib.sha256(data).hexdigest() if isinstance(data, bytes) else None

          def stat_fields(info):
              return {field: getattr(info, 'st_' + field, None) for field in
                      ('dev', 'ino', 'size', 'mtime_ns', 'ctime_ns', 'birthtime_ns')}

          def serializable(value):
              if isinstance(value, os.stat_result):
                  return stat_fields(value)
              if isinstance(value, bytes):
                  return {'length': len(value), 'raw_digest': file_hash(value)}
              if isinstance(value, Path):
                  return str(value)
              if isinstance(value, codec.VerificationResult):
                  return value.to_dict()
              if isinstance(value, dict):
                  return {key: serializable(item) for key, item in value.items()}
              if isinstance(value, (tuple, list)):
                  return [serializable(item) for item in value]
              return value

          attempts = []
          for attempt in range(1, 17):
              case = ObservedCase(method_name)
              result = unittest.TestResult()
              started = time.monotonic()
              case.run(result)
              elapsed = time.monotonic() - started
              events = getattr(case, 'events', [])
              reader = next((event['locals'] for event in reversed(events) if event['function'] == 'reader'), {})
              fd_samples = [{'observation': field, 'info': stat_fields(reader[field])}
                            for field in ('opened', 'after', 'final') if field in reader]
              mutations = [event['locals'] for event in events if event['function'] == 'mutation']
              mutation_count = len(getattr(case, 'mutation_calls', []))
              before_bytes = getattr(case, 'before_bytes', None)
              after_bytes = getattr(case, 'after_bytes', None)
              mutation_matches = bool(mutations) and after_bytes == mutations[-1].get('changed')
              capture_complete = len(fd_samples) == 3 and mutation_count == 1 and before_bytes != after_bytes and mutation_matches
              original_ok = result.testsRun == 1 and result.wasSuccessful() and not result.skipped
              report = {
                  'attempt': attempt, 'elapsed_seconds': elapsed,
                  'original_method': 'test_b_route_codec.ReadIdentityRegressionTests.' + method_name,
                  'tests_run': result.testsRun, 'original_method_ok': original_ok,
                  'capture_complete': capture_complete,
                  'mutation_invocations': mutation_count, 'mutation_exactly_once': mutation_count == 1,
                  'before_raw_digest': file_hash(before_bytes), 'after_raw_digest': file_hash(after_bytes),
                  'bytes_changed': before_bytes != after_bytes, 'after_matches_helper_changed_bytes': mutation_matches,
                  'fstat_observations': fd_samples,
                  'events': serializable(events),
                  'failures': [{'test': str(test), 'traceback': trace} for test, trace in result.failures],
                  'errors': [{'test': str(test), 'traceback': trace} for test, trace in result.errors],
                  'skipped': [{'test': str(test), 'reason': reason} for test, reason in result.skipped],
                  'causal_conclusion': None,
              }
              # Hashing, serialization, output, and file writes happen only
              # after this original test invocation and its cleanups have ended.
              (output / ('timestamp-diagnostic-' + str(attempt).zfill(2) + '.json')).write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              print('TIMESTAMP_DIAGNOSTIC=' + json.dumps(report, separators=(',', ':')), flush=True)
              attempts.append({'attempt': attempt, 'original_method_ok': original_ok,
                               'capture_complete': capture_complete, 'elapsed_seconds': elapsed,
                               'mutation_invocations': mutation_count, 'fstat_observations': len(fd_samples),
                               'fd_ctime_ns': [row['info']['ctime_ns'] for row in fd_samples]})
              print(json.dumps(attempts[-1]), flush=True)

          report = {
              'native_windows': True, 'attempts_requested': 16, 'attempts_completed': len(attempts),
              'environment': {
                  'python': sys.version, 'platform': sys.platform, 'windows_flag': codec._WINDOWS,
                  'codec_module': codec.__file__, 'codec_raw_digest': file_hash(Path(codec.__file__).read_bytes()),
                  'test_module': original_tests.__file__, 'test_raw_digest': file_hash(Path(original_tests.__file__).read_bytes()),
              },
              'attempts': attempts,
              'original_method_failure_observed': any(not row['original_method_ok'] for row in attempts),
              'all_captures_complete': all(row['capture_complete'] for row in attempts),
              'observation': 'original_method_failed_in_instrumented_trials' if any(not row['original_method_ok'] for row in attempts) else 'not_reproduced_in_16_instrumented_trials',
              'causal_conclusion': None,
              'limits': 'Return-event tracing adds overhead; these trials do not replace or clear the original full-suite result.',
          }
          (output / 'timestamp-diagnostics.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          raise SystemExit(0 if all(row['original_method_ok'] and row['capture_complete'] for row in attempts) else 1)
          '''
          diagnostic_path = output / 'timestamp-diagnostics.py'
          diagnostic_path.write_text(diagnostic_source, encoding='utf-8')
          summary['timestamp_diagnostic_source_sha256'] = hashlib.sha256(diagnostic_source.encode('utf-8')).hexdigest()
          diagnostic, _, _ = run_logged('timestamp-diagnostics', [sys.executable, '-B', str(diagnostic_path)], 60)
          try:
              summary['timestamp_diagnostics'] = json.loads((output / 'timestamp-diagnostics.json').read_text(encoding='utf-8'))
          except (OSError, ValueError):
              summary['timestamp_diagnostics'] = {'capture_completed': False, 'causal_conclusion': None}
              summary['exit_code'] = 1
          if summary['full_suite_exit_code'] or diagnostic['exit_code']:
              summary['exit_code'] = 1
          write_summary()

          def run_cli_fixtures():
              sys.path.insert(0, str(root / 'scripts/python'))
              from _b_route_codec import canonical_digest, raw_digest
              from _b_route_records import validate_record, validate_bundle

              fixture = output / 'cli-fixtures'
              fixture.mkdir(exist_ok=False)
              policy_path = 'docs/planning/b-route/policy.v1.json'
              origins_path = 'docs/planning/b-route/task-origins.v1.json'
              catalog_path = 'docs/planning/b-route/catalog.v1.json'
              policy = {
                  'schema_version': 'newrouge.b-route-policy.v1', 'policy_id': 'WINDOWS-POLICY', 'policy_revision': 1,
                  'switch_boundary': {'default_route': 'A', 'a_write_allowed': True, 'allowed_a_operations': [], 'authority_refs': []},
                  'frozen_a_refs': [],
              }
              origins = {'schema_version': 'newrouge.b-route-origins.v1', 'origins_id': 'task-origins', 'revision': 1, 'tasks': [], 'frozen_legacy_refs': []}

              def encode(value):
                  return (json.dumps(value, ensure_ascii=False, indent=2) + '\n').encode('utf-8')

              def save(path, data):
                  target = fixture / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

              policy_bytes, origins_bytes = encode(policy), encode(origins)
              def reference(path, value, data, entity, revision):
                  return {'path': path, 'schema_version': value['schema_version'], 'entity_id': entity, 'revision': revision, 'digest': raw_digest(data), 'verification_mode': 'raw', 'codec_version': None}
              catalog = {
                  'schema_version': 'newrouge.b-route-catalog.v1', 'catalog_id': 'catalog', 'revision': 1,
                  'policy_ref': reference(policy_path, policy, policy_bytes, 'WINDOWS-POLICY', 1),
                  'origins_ref': reference(origins_path, origins, origins_bytes, 'task-origins', 1),
                  'scope_heads': [], 'definition_owners': [], 'task_index': [],
              }
              records = {policy_path: policy_bytes, origins_path: origins_bytes, catalog_path: encode(catalog)}
              rows = []
              for index, (logical, data) in enumerate(records.items()):
                  source = 'inputs/candidate-' + str(index) + '.json'
                  save(source, data)
                  save(logical, data)
                  rows.append({'path': logical, 'source_path': source})
              save('candidates.json', encode({'records': rows}))
              bad_policy = dict(policy, unexpected='rejected')
              save('inputs/bad-policy.json', encode(bad_policy))
              save('inputs/duplicate.json', b'{"schema_version":"x","schema_version":"y"}')
              shadow_policy = dict(policy, switch_boundary=dict(policy['switch_boundary'], a_write_allowed=False))
              save('inputs/shadow-policy.json', encode(shadow_policy))
              shadow_rows = [dict(row, source_path='inputs/shadow-policy.json') if row['path'] == policy_path else row for row in rows]
              save('shadow.json', encode({'records': shadow_rows}))
              save('duplicate-carrier.json', encode({'records': rows + [rows[0]]}))
              save('unknown-carrier.json', encode({'records': rows, 'extra': True}))
              save('missing-source.json', encode({'records': [{'path': policy_path, 'source_path': 'inputs/missing.json'}]}))

              def snapshot(directory):
                  return {p.relative_to(directory).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in directory.rglob('*') if p.is_file()}

              before_inputs = snapshot(fixture)
              before_sources = {p: (root / p).read_bytes() for p in source_paths}
              before_bytecode = sorted(p.relative_to(root).as_posix() for p in root.rglob('*.pyc'))
              cases = [
                  ('record-ok', ['record', '--input', 'inputs/candidate-0.json', '--record-path', policy_path], 0, 'ok'),
                  ('record-unknown-field', ['record', '--input', 'inputs/bad-policy.json'], 1, 'unknown_field'),
                  ('record-duplicate', ['record', '--input', 'inputs/duplicate.json'], 1, 'duplicate_key'),
                  ('bundle-ok', ['bundle', '--input', 'candidates.json'], 0, 'ok'),
                  ('bundle-baseline-ok', ['bundle', '--input', 'candidates.json', '--baseline', 'candidates.json'], 0, 'ok'),
                  ('bundle-shadow', ['bundle', '--input', 'shadow.json'], 1, 'digest_mismatch'),
                  ('carrier-duplicate', ['bundle', '--input', 'duplicate-carrier.json'], 1, 'invalid_argument'),
                  ('carrier-unknown', ['bundle', '--input', 'unknown-carrier.json'], 1, 'invalid_argument'),
                  ('carrier-missing-source', ['bundle', '--input', 'missing-source.json'], 1, 'file_not_found'),
                  ('partial-join', ['bundle', '--input', 'candidates.json', '--task-master', 'unused.json'], 1, 'invalid_argument'),
                  ('record-missing', ['record', '--input', 'inputs/missing.json'], 1, 'file_not_found'),
                  ('no-write-option', ['record', '--input', 'inputs/candidate-0.json', '--write'], 1, 'invalid_argument'),
              ]
              results = []
              for name, arguments, expected_code, expected_reason in cases:
                  # Deliberately omit -B to exercise the CLI's own no-bytecode guard.
                  command = [sys.executable, str(root / 'scripts/python/validate_b_route_records.py'), arguments[0], '--repo-root', str(fixture)] + arguments[1:]
                  row, stdout, stderr = run_logged(name, command, 15)
                  try:
                      value = json.loads(stdout)
                      matched = row['exit_code'] == expected_code and value['diagnostic']['reason_code'] == expected_reason and not stderr
                      if name == 'record-ok':
                          expected = validate_record(policy_bytes, path=policy_path).to_dict()
                          matched = matched and value == expected
                          identity = value['content_identity']
                          matched = matched and identity['raw_digest'] == raw_digest(policy_bytes) and identity['canonical_digest'] == canonical_digest(policy) and identity['raw_digest'] != identity['canonical_digest']
                      if name == 'bundle-ok':
                          matched = matched and value == validate_bundle(records, root=fixture).to_dict() and value['monotonicity_checked'] is False
                      if name == 'bundle-baseline-ok':
                          matched = matched and value == validate_bundle(records, root=fixture, baseline=records).to_dict() and value['monotonicity_checked'] is True
                  except (ValueError, KeyError, TypeError):
                      matched = False
                  results.append({'name': name, 'matched': matched, 'expected_exit_code': expected_code, 'expected_reason': expected_reason, 'exit_code': row['exit_code']})
              unchanged = before_inputs == snapshot(fixture) and before_sources == {p: (root / p).read_bytes() for p in source_paths}
              no_bytecode = before_bytecode == sorted(p.relative_to(root).as_posix() for p in root.rglob('*.pyc'))
              report = {'cases': results, 'inputs_unchanged': unchanged, 'no_bytecode_written': no_bytecode, 'all_matched': all(row['matched'] for row in results)}
              (output / 'cli-results.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(report, indent=2), flush=True)
              return report['all_matched'] and unchanged and no_bytecode

          # Expected negative CLI invocations do not count as a failing subprocess step.
          units_exit_code = summary['exit_code']
          try:
              cli_ok = run_cli_fixtures()
          except Exception:
              import traceback
              (output / 'cli-unexpected.stderr').write_text(traceback.format_exc(), encoding='utf-8')
              traceback.print_exc()
              cli_ok = False
          summary['cli_ok'] = cli_ok
          summary['exit_code'] = 1 if units_exit_code or not cli_ok else 0
          write_summary()
          print(json.dumps(summary, indent=2), flush=True)
          raise SystemExit(summary['exit_code'])
      - name: Upload this run only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-1-4-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/ci/story-1-4-windows/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
